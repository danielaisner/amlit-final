<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmLit Final 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hr-bg: #12111a;
    --hr-accent: #d4a843;
    --hr-text: #f0ead6;
    --rs-bg: #140a0a;
    --rs-accent: #e05c5c;
    --rs-text: #fdf0f0;
    --cr-bg: #0a1410;
    --cr-accent: #4db87a;
    --cr-text: #edf7ef;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
 
  body[data-unit="hr"] { --bg: var(--hr-bg); --txt: var(--hr-text); --acc: var(--hr-accent); }
  body[data-unit="rs"] { --bg: var(--rs-bg); --txt: var(--rs-text); --acc: var(--rs-accent); }
  body[data-unit="cr"] { --bg: var(--cr-bg); --txt: var(--cr-text); --acc: var(--cr-accent); }
 
  header {
    text-align: center;
    padding: 32px 20px 0;
  }
 
  .eyebrow {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.4;
    margin-bottom: 8px;
  }
 
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--acc);
    margin-bottom: 4px;
  }
 
  .subtitle { font-size: 12px; opacity: 0.35; }
 
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 24px 16px 0;
    flex-wrap: wrap;
  }
 
  .tab {
    padding: 8px 18px;
    border-radius: 999px;
    border: 1.5px solid;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
  }
 
  .tab[data-unit="hr"] { border-color: var(--hr-accent); color: var(--hr-accent); }
  .tab[data-unit="rs"] { border-color: var(--rs-accent); color: var(--rs-accent); }
  .tab[data-unit="cr"] { border-color: var(--cr-accent); color: var(--cr-accent); }
 
  .tab.active[data-unit="hr"] { background: var(--hr-accent); color: var(--hr-bg); }
  .tab.active[data-unit="rs"] { background: var(--rs-accent); color: var(--rs-bg); }
  .tab.active[data-unit="cr"] { background: var(--cr-accent); color: var(--cr-bg); }
 
  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 16px 16px 0;
    flex-wrap: wrap;
    align-items: center;
  }
 
  input[type="text"] {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--txt);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    width: 220px;
  }
 
  input[type="text"]::placeholder { opacity: 0.35; }
 
  .toggle-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--acc);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
 
  .count { font-size: 12px; opacity: 0.35; }
 
  .tip {
    text-align: center;
    font-size: 11px;
    opacity: 0.3;
    padding: 10px 16px 0;
  }
 
  .cards {
    max-width: 680px;
    margin: 20px auto 0;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
 
  .card {
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.03);
    min-height: 72px;
    user-select: none;
  }
 
  .card:hover { border-color: rgba(255,255,255,0.15); }
 
  .card.flipped {
    background: rgba(255,255,255,0.06);
    border-color: var(--acc);
  }
 
  .card-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.35;
    margin-bottom: 6px;
  }
 
  .card-body {
    font-size: 14px;
    line-height: 1.55;
  }
 
  .card.flipped .card-body { color: var(--acc); }
 
  .card-hint {
    font-size: 11px;
    opacity: 0.25;
    margin-top: 8px;
  }
 
  .list-view {
    max-width: 680px;
    margin: 20px auto 0;
    padding: 0 16px;
  }
 
  .list-item {
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 14px 4px;
  }
 
  .list-q {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
    opacity: 0.9;
  }
 
  .list-a {
    font-size: 13px;
    color: var(--acc);
    padding-left: 12px;
    line-height: 1.5;
  }
 
  .export-wrap {
    max-width: 680px;
    margin: 30px auto 0;
    padding: 0 16px 60px;
  }
 
  details summary {
    font-size: 12px;
    opacity: 0.4;
    cursor: pointer;
    padding: 8px 0;
    list-style: none;
  }
 
  details summary::-webkit-details-marker { display: none; }
 
  textarea {
    width: 100%;
    height: 180px;
    margin-top: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--txt);
    font-size: 11px;
    padding: 10px;
    border-radius: 8px;
    resize: vertical;
    font-family: monospace;
    line-height: 1.6;
  }
 
  .export-note { font-size: 11px; opacity: 0.3; margin-top: 6px; }
 
  .hidden { display: none; }
</style>
</head>
<body data-unit="hr">
 
<header>
  <div class="eyebrow">AmLit Final 2026</div>
  <h1>Study Guide</h1>
  <div class="subtitle">67 questions · Multiple Choice / T-F / Matching</div>
</header>
 
<div class="tabs">
  <button class="tab active" data-unit="hr" onclick="switchUnit('hr')">Harlem Renaissance</button>
  <button class="tab" data-unit="rs" onclick="switchUnit('rs')">A Raisin in the Sun</button>
  <button class="tab" data-unit="cr" onclick="switchUnit('cr')">The Crucible</button>
</div>
 
<div class="controls">
  <input type="text" id="search" placeholder="Search questions..." oninput="renderCards()">
  <button class="toggle-btn" onclick="toggleMode()">📋 List View</button>
  <span class="count" id="count"></span>
</div>
 
<div class="tip">💡 Tap a card to flip and reveal the answer</div>
 
<div id="cards-container" class="cards"></div>
<div id="list-container" class="list-view hidden"></div>
 
<div class="export-wrap">
  <details>
    <summary>📤 Quizlet Import Text (click to expand)</summary>
    <textarea id="export-text" readonly></textarea>
    <div class="export-note">Quizlet → Create → Import → paste → Tab delimiter, New Line row separator → Import</div>
  </details>
</div>
 
<script>
const units = {
  hr: [
    { q: "Who are the two major figures of the Harlem Renaissance?", a: "Langston Hughes and Gwendolyn Brooks" },
    { q: "What does 'Renaissance' mean and why is it applied to Harlem?", a: "Rebirth — a cultural rebirth of Black art, literature, and music centered in Harlem in the 1920s–30s" },
    { q: "Where did the Harlem Renaissance spread in the United States?", a: "From Harlem to Northern cities like Chicago, Philadelphia, and Washington D.C. — due to the Great Migration" },
    { q: "What historical event paved the way for the Harlem Renaissance?", a: "The Great Migration — Black Americans moved North to escape Jim Crow laws and seek better opportunities" },
    { q: "What form of music was influenced by Harlem Renaissance poetry?", a: "Jazz and Blues" },
    { q: "What did Hughes mean by 'a dream deferred' in 'Harlem'?", a: "A dream that is delayed — representing suppressed hopes of Black Americans; it may dry up, fester, or explode" },
    { q: "What poetic device does Brooks use throughout 'We Real Cool'?", a: "Anaphora (repetition of 'We') and internal rhyme / end-stopped lines" },
    { q: "Which Hughes poem contains 'I, too, am America'?", a: "'I, Too'" },
    { q: "What is 'In Time of Silver Rain' about?", a: "Hope and nature — rain as renewal, by Langston Hughes" },
    { q: "What is 'America' by Claude McKay about?", a: "Resistance and defiance despite racial oppression" },
  ],
  rs: [
    { q: "What genre does A Raisin in the Sun belong to? (ends in -ism)", a: "Realism" },
    { q: "Who wrote the poem that influenced the title of the play?", a: "Langston Hughes — 'Harlem (A Dream Deferred)'" },
    { q: "What is the main conflict in A Raisin in the Sun?", a: "The Younger family disagrees on how to use a $10,000 life insurance check while facing racism and poverty" },
    { q: "What did Hansberry mean by 'assimilationist negroes'?", a: "Black people who abandon their African identity and culture to blend into white society — Beneatha criticizes this" },
    { q: "Why was Mama receiving a check and why is it important to the family?", a: "$10,000 life insurance from Big Walter's death — represents an opportunity to escape poverty and fulfill dreams" },
    { q: "What does Asagai's nickname for Beneatha translate to, and why is it important?", a: "'Alaiyo' — meaning 'One for Whom Bread Is Not Enough' — she needs purpose, not just material things" },
    { q: "What is the significance of the 'Prometheus' insult against Walter Lee?", a: "Prometheus was punished for reaching beyond his place — comparing Walter implies he is punished for his ambitions" },
    { q: "Why does Walter Lee eventually reject Lindner's offer?", a: "To reclaim his dignity and family pride — refuses to sell out to racism and decides to move in regardless" },
    { q: "What is the relationship between Walter Lee and Ruth?", a: "Husband and wife — strained by poverty but ultimately loving" },
    { q: "What is the significance of Mama's plant?", a: "Symbolizes the family's dreams and resilience — survives with little light, just as they survive in poverty with persistent hope" },
    { q: "Who is Walter Lee Younger?", a: "The son/husband — a chauffeur who dreams of owning a liquor store; frustrated, proud, central character" },
    { q: "Who is Beneatha Younger?", a: "Walter's sister — a college student who wants to be a doctor and reconnects with her African roots" },
    { q: "Who is Ruth Younger?", a: "Walter's wife — practical and emotionally strong; keeps the family together" },
    { q: "Who is Lena 'Mama' Younger?", a: "The family matriarch — deeply religious; uses the insurance money to buy a house in an all-white neighborhood" },
    { q: "Who is Travis Younger?", a: "Walter and Ruth's young son" },
    { q: "Who is Joseph Asagai?", a: "A Nigerian student courting Beneatha who encourages her African identity" },
    { q: "Who is George Murchison?", a: "A wealthy assimilationist Black man who also courts Beneatha; dismisses African heritage" },
    { q: "Who is Willy Harris?", a: "Walter's 'friend' who takes the insurance money and runs — representing betrayal and Walter's naivety" },
    { q: "Who is Bobo?", a: "Walter's friend who comes to break the news that Willy Harris stole the money" },
    { q: "Who is Karl Lindner?", a: "A white representative from Clybourne Park who offers to pay the Youngers NOT to move in" },
  ],
  cr: [
    { q: "Who urges Elizabeth Proctor to persuade her husband to confess to witchcraft?", a: "Reverend Hale" },
    { q: "Who dies by being crushed with stones?", a: "Giles Corey" },
    { q: "Who blames herself for John's affair with Abigail? Why?", a: "Elizabeth Proctor — she felt she was a cold, unloving wife which she believes drove John to Abigail" },
    { q: "Who kept a 'cold house' by not being a loving wife?", a: "Elizabeth Proctor (according to John)" },
    { q: "Who calls for more weight as his last words? What does it mean?", a: "Giles Corey — he refused to enter a plea, dying under rocks rather than confessing, preserving his land for his sons" },
    { q: "The final scene between Elizabeth and John shows their...", a: "Reconciliation / mutual forgiveness and love" },
    { q: "Whose main struggle in this play is with his own conscience?", a: "John Proctor" },
    { q: "Who flees Salem at the end of the play? Why?", a: "Abigail Williams — steals Parris's money and disappears as the hysteria collapses" },
    { q: "When Elizabeth says John 'has his goodness now,' she means he has his _____ now.", a: "Integrity / honor" },
    { q: "Who feels John Proctor must face his own conscience about confessing?", a: "Reverend Hale" },
    { q: "What word in this play means a severe test or trial?", a: "Crucible" },
    { q: "Name the girls (other than Abigail) caught dancing in the woods.", a: "Mary Warren, Mercy Lewis, Betty Parris, Tituba, Ruth Putnam" },
    { q: "Who is a slave from Barbados devoted to Betty Parris?", a: "Tituba" },
    { q: "Who is Reverend Parris's niece? Why is it important?", a: "Abigail Williams — her relationship to Parris creates a conflict of interest and complicates the court proceedings" },
    { q: "Who lost seven children in infancy?", a: "Ruth Putnam" },
    { q: "Who is the expert on witchcraft called to help Salem? Is he an expert?", a: "Reverend Hale — presents himself as an expert but his 'expertise' contributes to unjust hangings" },
    { q: "What is the setting of The Crucible? What year?", a: "Salem Village, Massachusetts — 1692" },
    { q: "Who does John Proctor predict will be in the stocks before she is twenty?", a: "Abigail Williams — because of her wild, deceptive nature" },
    { q: "What phrase best describes John Proctor?", a: "A good man with a fatal flaw (his affair with Abigail) who ultimately chooses integrity over survival" },
    { q: "Whose trancelike state is most likely because she fears punishment for dancing in the woods?", a: "Betty Parris" },
    { q: "Who threatens Betty because she is afraid the villagers will know what they did in the woods?", a: "Abigail Williams" },
    { q: "Who suggests the names Sarah Good and Sarah Osbourn as first 'trial' victims? Why are they easy targets?", a: "Thomas Putnam suggests them — they are poor and marginalized, already disliked by the community" },
    { q: "Who could be described as a proud man who does not like his authority challenged?", a: "Deputy Governor Danforth" },
    { q: "What person who supported the trials begins to doubt them? What causes the doubts?", a: "Reverend Hale — he sees innocent people condemned and the process is corrupt" },
    { q: "Who is the richest man in the village who can afford to buy land forfeited by George Jacobs?", a: "Thomas Putnam" },
    { q: "Who is asked to faint on command in court?", a: "Mary Warren" },
    { q: "John tells the court his wife will not do what?", a: "Lie — but she does lie to protect him, which backfires" },
    { q: "What do the girls do with everything Mary Warren says in court?", a: "They mimic her and turn accusations back on her" },
    { q: "Whose deposition does Danforth dismiss for not revealing the name of his source?", a: "Giles Corey's" },
    { q: "Along with Danforth, who has signed many death warrants?", a: "Judge Hathorne" },
    { q: "What does Giles believe is Putnam's motivation for accusing people of witchcraft?", a: "Land — Putnam wants to acquire the property of those who are hanged" },
    { q: "Who turns back to Abigail after not being believed by the court?", a: "Mary Warren" },
    { q: "Abigail and the other girls claim they see a _____ in court.", a: "Yellow bird (a spirit/specter)" },
    { q: "Whose concerns about court proceedings do not include seeing justice done? What are the real concerns?", a: "Danforth's — his real concern is protecting the court's authority and reputation" },
    { q: "Who is hanged mostly because he denounces the witch trials?", a: "John Proctor" },
    { q: "Why does Elizabeth lie about John's affair with Abigail?", a: "To protect John's reputation — but it backfires because the court uses her lie to discredit John" },
    { q: "Who works for the Proctors and claims to be an official of the court?", a: "Mary Warren" },
    { q: "Earlier in the play, Elizabeth is afraid her husband is still drawn to whom?", a: "Abigail Williams" },
    { q: "How does one accused of being a witch save herself?", a: "By confessing to witchcraft and naming others as witches" },
    { q: "John Proctor stays away from church because he doesn't like whom? What reason does he give?", a: "Reverend Parris — John says Parris talks too much about hell and money, and not enough about God" },
    { q: "Which commandment does John forget when speaking to Reverend Hale?", a: "Thou shalt not commit adultery — the one he himself broke" },
    { q: "What is the significance of the doll given to Elizabeth by Mary? How does Abigail use it?", a: "The poppet has a needle in it; Abigail claims Elizabeth used witchcraft to harm her. Mary unknowingly gave Abigail the idea." },
    { q: "Was Mary Warren in on the poppet scheme?", a: "No — she innocently made the doll; Abigail exploited it" },
    { q: "Who does John force to tell the court that Abigail is lying?", a: "Mary Warren" },
    { q: "Who is the leader of the accusers in court?", a: "Abigail Williams" },
    { q: "Why does Elizabeth say that Abigail wants her dead?", a: "Abigail is in love with John Proctor and wants Elizabeth out of the way so she can have him" },
    { q: "Who is Reverend Samuel Parris?", a: "The minister of Salem Village, Betty's father, Abigail's uncle — self-interested and paranoid" },
    { q: "Who is Reverend John Hale?", a: "A witchcraft expert from Beverly who initially supports the trials but later turns against them" },
    { q: "Who is Abigail Williams?", a: "Parris's niece, the main accuser, and John Proctor's former lover" },
    { q: "Who is John Proctor?", a: "A local farmer, morally complex protagonist who had an affair with Abigail and ultimately chooses to die rather than falsely confess" },
    { q: "Who is Elizabeth Proctor?", a: "John's wife — honest, initially cold, but deeply loving; falsely accused of witchcraft" },
    { q: "Who is Deputy Governor Danforth?", a: "The judge presiding over the trials — stubborn, authoritative, unwilling to admit the court made errors" },
    { q: "Who is Thomas Putnam?", a: "A wealthy, land-hungry Salem citizen who pressures others and benefits from the accusations" },
    { q: "Who is Ann Putnam?", a: "Thomas's wife — bitter after losing seven children; blames witchcraft and pushes her daughter Ruth to accuse others" },
    { q: "Who is Mary Warren?", a: "The Proctors' servant, one of the accusers who tries to recant but is pressured back by Abigail" },
    { q: "Who is Arthur Miller?", a: "The author of The Crucible — wrote it as an allegory for McCarthyism in the 1950s" },
  ]
};
 
let currentUnit = 'hr';
let currentMode = 'cards';
let flipped = {};
 
function switchUnit(unit) {
  currentUnit = unit;
  flipped = {};
  document.body.setAttribute('data-unit', unit);
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-unit="${unit}"]`).classList.add('active');
  document.getElementById('search').value = '';
  renderCards();
}
 
function toggleMode() {
  currentMode = currentMode === 'cards' ? 'list' : 'cards';
  const btn = document.querySelector('.toggle-btn');
  btn.textContent = currentMode === 'cards' ? '📋 List View' : '🃏 Card View';
  renderCards();
}
 
function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  return units[currentUnit].filter(c =>
    c.q.toLowerCase().includes(q) || c.a.toLowerCase().includes(q)
  );
}
 
function renderCards() {
  const filtered = getFiltered();
  document.getElementById('count').textContent = filtered.length + ' cards';
 
  const cardsEl = document.getElementById('cards-container');
  const listEl = document.getElementById('list-container');
 
  if (currentMode === 'cards') {
    cardsEl.classList.remove('hidden');
    listEl.classList.add('hidden');
    cardsEl.innerHTML = filtered.map((card, i) => `
      <div class="card${flipped[i] ? ' flipped' : ''}" onclick="flip(${i})">
        <div class="card-label">${flipped[i] ? 'Answer' : 'Q' + (i+1)}</div>
        <div class="card-body">${flipped[i] ? card.a : card.q}</div>
        ${!flipped[i] ? '<div class="card-hint">tap to reveal →</div>' : ''}
      </div>
    `).join('');
  } else {
    cardsEl.classList.add('hidden');
    listEl.classList.remove('hidden');
    listEl.innerHTML = filtered.map((card, i) => `
      <div class="list-item">
        <div class="list-q">${i+1}. ${card.q}</div>
        <div class="list-a">→ ${card.a}</div>
      </div>
    `).join('');
  }
 
  document.getElementById('export-text').value =
    filtered.map(c => c.q + '\t' + c.a).join('\n');
}
 
function flip(i) {
  flipped[i] = !flipped[i];
  renderCards();
}
 
renderCards();
</script>
</body>
</html>
